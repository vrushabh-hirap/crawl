[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-jobs"
version = "1.2.0"
description = "A production-quality web crawling, job searching, ATS scoring, and NLP analytics engine built from scratch."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vrushabh Hirap"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "spacy>=3.7.0",
    "nltk>=3.8",
]

[project.optional-dependencies]
web = [
    "flask>=2.0.0"
]
semantic = [
    "sentence-transformers>=2.7.0"
]
analytics = [
    "numpy>=1.20.0"
]
all = [
    "flask>=2.0.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crawl*"]

[tool.setuptools.package-data]
"crawl.jobs.web" = ["static/*.html"]
"crawl.jobs.ats" = ["data/*.json", "data/*.txt"]

[project.scripts]
crawl-jobs = "crawl.cli:main"
crawl-any-website = "crawl.cli:main"
crawl = "crawl.cli:main"

