[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-jobs"
version = "1.0.0"
description = "A production-quality web crawling and HTML parsing engine built completely from scratch."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vrushabh Hirap"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
web = [
    "flask>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crawl*"]

[tool.setuptools.package-data]
"crawl.jobs.web" = ["static/*.html"]

[project.scripts]
crawl-any-website = "crawl.cli:main"
crawl = "crawl.cli:main"

